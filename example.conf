# Exemplo do formato aceito -- NÃO é uma configuração que funciona.
#
# Gere a sua no painel do seu provedor (ProtonVPN, Mullvad, ou um servidor
# próprio) e salve como wireguard.conf ao lado do binário, ou aponte com:
#
#     ./discord-go-vpn -c /caminho/da/sua.conf
#
# No ProtonVPN o caminho é Downloads -> WireGuard configuration, e o tier
# gratuito serve.

[Interface]
PrivateKey = <a sua chave privada, 44 caracteres em base64>
Address = 10.2.0.2/32
DNS = 10.2.0.1

[Peer]
PublicKey = <a chave pública do servidor>
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = servidor.exemplo.net:51820
PersistentKeepalive = 25
