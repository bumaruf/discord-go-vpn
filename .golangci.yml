version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    # Idiomatic unchecked errors, such as Close on readers and fmt printing.
    presets: [std-error-handling]
  settings:
    staticcheck:
      # staticcheck's defaults.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
