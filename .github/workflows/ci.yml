name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-test:
    name: Go (make test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test

  go-lint:
    name: Go (make lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Makefile pins golangci-lint; a key distinct from go-test's lets each job keep its own build cache.
          cache-dependency-path: |
            go.sum
            Makefile
      - run: make lint

  android:
    name: Android (make android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The runner image ships the Android SDK, an NDK and JDK 17.
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" make android

  panel:
    name: Panel (lint, typecheck, format, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  panel-changed:
    name: Panel changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A diff that fails (a before commit that is gone) counts as a change.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE" HEAD -- panel .github/workflows/deploy-panel.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  preview-panel:
    name: Preview panel
    needs: [panel, panel-changed]
    # Forks get no secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.panel-changed.outputs.changed == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/deploy-panel.yml
    with:
      target: preview
    secrets: inherit

  deploy-panel:
    name: Deploy panel
    needs: [panel, panel-changed]
    if: github.event_name == 'push' && needs.panel-changed.outputs.changed == 'true'
    # GitHub checks every job of the called workflow against these, even the preview job this
    # call skips, which comments on pull requests.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/deploy-panel.yml
    with:
      target: production
    secrets: inherit

  server-changed:
    name: Server image changed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The paths server/Dockerfile builds from. A diff that fails (a before commit that is gone)
      # counts as a change.
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git diff --quiet "$BEFORE" HEAD -- go.mod go.sum cmd/provisiond internal/provisiond \
            server/Dockerfile server/wg-up.sh server/provisiond-up.sh; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-server:
    name: Deploy server
    needs: [go-test, go-lint, server-changed]
    if: needs.server-changed.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-server.yml
    with:
      sha: ${{ github.sha }}
    # Without it the called job's vps environment secrets arrive empty (actions/runner#4453).
    secrets: inherit
