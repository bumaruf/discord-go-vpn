name: Release

# A v* tag publishes the client binaries and the Android APK with the signed
# update manifest that installed clients read from releases/latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Clients compare versions as semver, which rejects leading zeros such as v2026.09.26.
      - name: Check the tag is semver
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH without leading zeros, such as v2026.10.21"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
      - run: make dist VERSION="$GITHUB_REF_NAME"
      - run: make sign VERSION="$GITHUB_REF_NAME"
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      # Without ANDROID_KEYSTORE_BASE64 the APK gets this runner's debug key, and
      # it can't update the one from the previous release.
      - name: Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a debug key"
          fi
      # The runner image ships the Android SDK, an NDK and JDK 17.
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" make android VERSION="$GITHUB_REF_NAME"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: cd dist && sha256sum discord-go-vpn.apk >> SHA256SUMS
      - run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/discord-go-vpn dist/discord-go-vpn-arm64 dist/discord-go-vpn.exe dist/discord-go-vpn-arm64.exe \
            dist/discord-go-vpn.apk dist/SHA256SUMS dist/update.json dist/update.json.sig
        env:
          GH_TOKEN: ${{ github.token }}
