name: Deploy server

# Called by CI after a push to main that changes provisiond's image; run by hand to redeploy
# or roll back to an older commit. Setup and secrets: server/README.md, Deploy contínuo.
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (full SHA); empty deploys the head of the selected branch
        required: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/bumaruf/discord-go-vpn/provisiond

jobs:
  image:
    name: Build and push the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.commit.outputs.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the VPS
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Not "production": environment names ignore case, and Vercel's Production is the panel's.
    environment: vps
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    steps:
      - name: Run server/deploy.sh on the VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SHA: ${{ needs.image.outputs.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's forced command hands this SHA to server/deploy.sh as its only argument.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes "deploy@$HOST" "$SHA"
